name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Configure Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "storeFile=../release.jks" > keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
          fi

      - name: Assemble Release APK
        run: ./gradlew assembleRelease

      - name: Clean up Keystore
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Package Release Asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          
          APK_DEST="RestYourEyes-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "ASSET_APK=$APK_DEST" >> $GITHUB_ENV

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_APK }}
          draft: false
          prerelease: false
          generate_release_notes: true
